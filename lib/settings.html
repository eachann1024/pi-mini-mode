<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Mini Mode 设置</title>
<style>
:root{color-scheme:light dark;--background:light-dark(#f4f3ef,#141614);--foreground:light-dark(#1f241f,#eceee8);--surface:light-dark(#fffcf7,#1d211d);--muted:light-dark(#667066,#a8b0a4);--border:light-dark(#e2ddd4,#3a4038);--accent:light-dark(#2f5a3e,#b7d4b0);--destructive:light-dark(#a52c26,#ffafa5);--ring:var(--accent);--text-sm:.875rem;--text-base:1rem;--text-lg:2.75rem;--radius:8px}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:var(--text-base)/1.5 ui-sans-serif,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:40px 24px 72px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font:italic 400 var(--text-lg)/1.05 "Didot","Bodoni 72","Iowan Old Style","Songti SC","STSong",serif;letter-spacing:.04em;margin:0}h2{font-size:var(--text-sm);font-weight:600;margin:0 0 12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.tagline{margin:8px 0 0;color:var(--muted);font-size:var(--text-sm)}nav{display:flex;gap:8px;align-items:center}.hint{margin:12px 0 0;color:var(--accent);font-weight:600}section{margin:28px 0}button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--ring);outline-offset:3px}#preview{padding:16px 20px;background:var(--surface);border:1px dashed var(--accent);border-radius:var(--radius);font:var(--text-sm)/1.8 ui-monospace,monospace;display:flex;align-items:center;gap:12px;overflow-x:auto;min-height:72px;white-space:nowrap}#preview button{flex:none;font:inherit;padding:4px 2px;border-color:transparent;cursor:grab;white-space:nowrap}#preview button:hover{border-color:var(--border)}#preview button.over{border-left:2px solid var(--accent)}#preview #preview-context{flex:1;display:flex;align-items:center;gap:8px;min-width:180px}.progress{flex:1;overflow:hidden;text-align:left;color:var(--accent);min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px}label{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}input{accent-color:var(--accent);width:18px;height:18px;flex-shrink:0}.dragging{opacity:.45}#status{min-height:24px;color:var(--accent)}#status.error{color:var(--destructive)}#retry{margin-left:12px}[hidden]{display:none!important}nav button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.feature{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}.feature-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.feature-head h3{margin:0;font-size:var(--text-base);font-weight:600}.feature-body{margin:10px 0 0;color:var(--muted);font-size:var(--text-sm);line-height:1.65}.feature-points{margin:10px 0 0;padding-left:1.15em;font-size:var(--text-sm);line-height:1.7}.feature-points li{margin:2px 0}.feature-points li::marker{color:var(--accent)}.feature-hint{margin:auto 0 0;padding-top:12px;color:var(--muted);font:var(--text-sm)/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.feature-hint::before{content:'› ';color:var(--accent)}.switch{display:flex;align-items:center;gap:8px;padding:0;font-size:var(--text-sm);color:var(--muted)}.notice{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin:20px 0 0;padding:14px 16px;background:var(--surface);border:1px solid var(--accent);border-left-width:4px;border-radius:var(--radius)}.notice strong{font-size:var(--text-sm)}.notice p{margin:6px 0 0;color:var(--muted);font-size:var(--text-sm);line-height:1.6;max-width:640px}.notice code{display:block;margin:0 0 8px;padding:8px 10px;background:var(--background);border:1px solid var(--border);border-radius:var(--radius);font:var(--text-sm)/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-width:520px;color:var(--foreground)}#preview{margin-top:12px}@media(max-width:450px){h1{font-size:2rem}main{padding:24px 16px}}
</style>
<main>
<header>
  <div><h1 id="title"></h1><p class="tagline" id="tagline"></p></div>
  <nav>
    <button type="button" id="lang-zh" aria-pressed="false">中文</button>
    <button type="button" id="lang-en" aria-pressed="false">EN</button>
    <button type="button" id="reset" disabled></button>
  </nav>
</header>
<div class="notice" id="notice" hidden>
  <div><strong id="noticeTitle"></strong><p id="noticeBody"></p></div>
  <div><code id="noticePrompt"></code><button type="button" id="copyPrompt"></button></div>
</div>
<div role="status" aria-live="polite"><span id="status"></span><button id="retry" hidden></button></div>
<section><h2 id="featuresHeading"></h2><div class="features" id="features"></div></section>
<section><h2 id="fieldsHeading"></h2><p class="hint" id="dragHint"></p><div id="preview" role="group" tabindex="0"></div><div class="grid" id="fields"></div></section>
<section><h2 id="optionsHeading"></h2><div class="grid" id="options"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),token=location.hash.slice(1);
history.replaceState(null,'',location.pathname);
const I18N={
  title:{zh:'Pi Mini Mode',en:'Pi Mini Mode'},
  documentTitle:{zh:'Pi Mini Mode 设置',en:'Pi Mini Mode Settings'},
  tagline:{zh:'极简状态栏配置',en:'Minimal status bar setup'},
  dragHint:{zh:'拖拽预览中的字段可调整顺序，松手自动保存',en:'Drag items in the preview to reorder · Auto-saves on drop'},
  featuresHeading:{zh:'功能说明',en:'Features'},
  fieldsHeading:{zh:'状态栏字段与预览',en:'Status bar items & preview'},
  optionsHeading:{zh:'状态栏样式',en:'Status bar style'},
  on:{zh:'开启',en:'On'},off:{zh:'关闭',en:'Off'},
  featureList:{
    zh:[
      {id:'status',title:'状态栏指标',body:'一行看清会话状态，随终端宽度自动取舍，不换行。',points:['模型与思考等级，会话与缓存 Token、缓存命中率、费用估算','上下文用量进度条与百分比','生成速度 tok/s，从第一个输出 token 起算，不含等待首字'],hint:'勾选需要的字段，拖拽预览中的条目即可排序。'},
      {id:'minimal',setting:'pi-mini-mode-minimal-show',title:'极简输出',body:'把对话收成结论：思考、工具与技能汇成一棵按时间排序的可折叠过程树。',points:['长用户消息默认保留前四行，点击折叠控件展开全文','子代理行可展开活动记录与最终输出','Ctrl+O 展开或收起完整过程树，新问题默认收起','最终 Markdown 流畅呈现，失败与中断明确标记'],hint:'/pi-mini-mode-minimal on|off · /pi-mini-mode-prompts · /pi-mini-mode-history'},
      {id:'input-enhancements',setting:'pi-mini-mode-input-enhancements',title:'输入增强',body:'让输入框和消息里的图片、技能与文件路径直接可用。',points:['光标移入图片路径即可预览，全屏编辑器也支持悬停','图片路径收纳为 [image1] 标签，提交时保留原图','空白后输入 / 就地搜索技能，并在光标处插入','点击图片标签或消息中的文件路径，用系统默认应用打开'],hint:'Ctrl+V 粘贴图片（Windows/WSL 使用 Alt+V）'},
      {id:'themes',title:'明暗主题',body:'内置 cc-dark 与 cc-light 两套主题，Markdown、代码高亮、表格与 Mermaid 图表一并适配明暗。',points:['用户消息使用主题的用户背景色，与正文清晰区分','不支持、不完整或过宽的图表保留源文本'],hint:'/pi-mini-mode-settings 配置所有选项'}
    ],
    en:[
      {id:'status',title:'Status bar metrics',body:'The whole session state on one line, trimmed to fit narrow terminals instead of wrapping.',points:['Model and thinking level, session and cache tokens, cache hit rate, cost estimate','Context usage bar with percentage','Speed in tok/s, measured from the first output token, excluding time to first token'],hint:'Enable the items you need, then drag entries in the preview to reorder.'},
      {id:'minimal',setting:'pi-mini-mode-minimal-show',title:'Minimal transcript',body:'Turns the conversation into conclusions: thinking, tools and skills collapse into one chronological, foldable tree.',points:['Long user messages keep four lines; click the fold control to expand','Subagent rows expand to activity and final output','Ctrl+O expands or collapses the full process tree; new questions start collapsed','Final Markdown streams plainly; failures and interrupts are marked'],hint:'/pi-mini-mode-minimal on|off · /pi-mini-mode-prompts · /pi-mini-mode-history'},
      {id:'input-enhancements',setting:'pi-mini-mode-input-enhancements',title:'Input enhancements',body:'Makes images, skills and file paths usable right where you type.',points:['Preview an image as soon as the cursor enters its path; hovering works in fullscreen','Image paths collapse to [image1] labels while keeping the original path on submit','Type / after a space to search skills and insert one at the cursor','Click image labels or file paths in messages to open them in the default app'],hint:'Ctrl+V pastes images (Windows/WSL: Alt+V)'},
      {id:'themes',title:'Light and dark themes',body:'Built-in cc-dark and cc-light adapt Markdown, code highlighting, tables and Mermaid diagrams to the color scheme.',points:['User messages use the theme user background to stand apart from the body','Unsupported, incomplete or overly wide diagrams keep their source text'],hint:'/pi-mini-mode-settings to configure all options'}
    ]
  },
  reset:{zh:'恢复默认',en:'Reset defaults'},
  retry:{zh:'重试',en:'Retry'},
  confirmReset:{zh:'恢复默认排序与显示设置？',en:'Reset layout and visibility to defaults?'},
  connecting:{zh:'正在同步…',en:'Connecting…'},
  connected:{zh:'已同步',en:'In sync'},
  unsaved:{zh:'未保存修改',en:'Unsaved changes'},
  saving:{zh:'正在保存…',en:'Saving…'},
  saved:{zh:'已保存',en:'Saved'},
  saveFailed:{zh:'保存失败',en:'Failed to save'},
  reconnect:{zh:'连接已断开，请从终端重新打开',en:'Disconnected. Please reopen from the terminal.'},
  noticeTitle:{zh:'极简输出需要全屏渲染器',en:'Minimal transcript needs the fullscreen renderer'},
  noticeBody:{zh:'极简输出已保存，但当前 Pi 运行在普通 TUI 模式，暂不生效。复制下面的提示词发给 Pi，让它帮你把 TUI 模式改为 fullscreen；重启 Pi 后生效（/reload 不会切换渲染器）。',en:'Minimal transcript is saved but inactive: Pi is running in regular TUI mode. Copy the prompt below into Pi to set TUI mode to fullscreen; it takes effect after restarting Pi (/reload does not switch the renderer).'},
  noticePrompt:{zh:'把 Pi 全局设置中的 tuiMode 改为 fullscreen',en:'Set tuiMode to fullscreen in Pi global settings'},
  copyPrompt:{zh:'复制提示词',en:'Copy prompt'},
  copied:{zh:'已复制',en:'Copied'},
  copyFailed:{zh:'复制失败，请手动选中',en:'Copy failed — select manually'},
  emptyPreview:{zh:'（未启用任何字段）',en:'(No items enabled)'},
  fields:{
    'project-branch':{zh:'项目与分支',en:'Project & Branch'},
    model:{zh:'模型名称',en:'Model'},
    thinking:{zh:'思考等级',en:'Thinking Level'},
    branch:{zh:'仅分支',en:'Branch Only'},
    'session-tokens':{zh:'会话 Token',en:'Session Tokens'},
    'cache-tokens':{zh:'缓存 Token',en:'Cache Tokens'},
    ch:{zh:'缓存命中率',en:'Cache Hit Rate'},
    cost:{zh:'累计费用',en:'Cost'},
    mcp:{zh:'MCP 服务数',en:'MCP Count'},
    context:{zh:'上下文进度条',en:'Context Bar'},
    'context-percent':{zh:'上下文百分比',en:'Context %'},
    speed:{zh:'生成速度',en:'Speed'},
    'context-dots':{zh:'点阵进度条',en:'Dot-matrix bar'},
    'speed-unit':{zh:'速度附带单位',en:'Speed unit (tok/s)'},
    minimal:{zh:'极简对话输出',en:'Minimal transcript'},
    'input-enhancements':{zh:'输入体验增强',en:'Input enhancements'}
  }
};
const FIELD_KEY={minimal:'pi-mini-mode-minimal-show','input-enhancements':'pi-mini-mode-input-enhancements','context-dots':'pi-mini-mode-context-dots-show','speed-unit':'pi-mini-mode-speed-unit-show'};
let lang=localStorage.piMiniModeLang||(navigator.language.startsWith('zh')?'zh':'en');
let data,state,order,dragged,saving=false,dirty=false,timer,copyTimer;
const key=id=>'pi-mini-mode-'+id+'-show';
const t=(id,fallback='')=>(I18N[id]?.[lang]??fallback);
const fieldLabel=id=>I18N.fields[id]?.[lang]||id;
const examples={'project-branch':'pi-mini-mode(main)',model:'deepseek-v4-flash',thinking:'high',branch:'main','session-tokens':'Total 45K','cache-tokens':'Cached 25K',ch:'CH 40.0%',cost:'$0.012',mcp:'◇ MCP 3',context:'500/1.0M','context-percent':'1%',speed:'120 tok/s'};
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.title=t('documentTitle');
  for(const id of ['title','tagline','featuresHeading','fieldsHeading','optionsHeading','dragHint']) $(id).textContent=t(id);
  $('reset').textContent=t('reset');$('retry').textContent=t('retry');
  $('lang-zh').setAttribute('aria-pressed',String(lang==='zh'));
  $('lang-en').setAttribute('aria-pressed',String(lang==='en'));
  $('preview').setAttribute('aria-label',t('dragHint'));
}
async function request(method,body){
  const response=await fetch('/settings',{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(!response.ok)throw Error(await response.text()||t('saveFailed'));
  return response.json();
}
function preview(){
  const panel=$('preview'),scroll=panel.scrollLeft;
  panel.replaceChildren();
  const visible=order.filter(id=>state[key(id)]);
  const values={...examples,speed:state['pi-mini-mode-speed-unit-show']?'120 tok/s':'120'};
  for(const id of visible){
    const button=document.createElement('button');
    button.id='preview-'+id;button.type='button';button.textContent=values[id];button.draggable=true;
    if(id==='context'){const bar=document.createElement('span');bar.className='progress';bar.setAttribute('aria-hidden','true');bar.textContent=state['pi-mini-mode-context-dots-show']?'⣿'+'⣀'.repeat(300):'█'+'░'.repeat(300);button.append(bar)}
    button.setAttribute('aria-label',fieldLabel(id)+' · '+t('dragHint'));
    button.ondragstart=event=>{dragged=id;event.dataTransfer.setData('text/plain',id);event.dataTransfer.effectAllowed='move';button.classList.add('dragging')};
    button.ondragend=()=>{dragged=undefined;button.classList.remove('dragging');document.querySelectorAll('.over').forEach(el=>el.classList.remove('over'))};
    button.ondragover=event=>{if(dragged){event.preventDefault();button.classList.add('over')}};
    button.ondragleave=()=>button.classList.remove('over');
    button.ondrop=event=>{event.preventDefault();const source=dragged;dragged=undefined;if(source){move(order.indexOf(source),order.indexOf(id));$('preview-'+source)?.focus()}};
    button.onkeydown=event=>{if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;event.preventDefault();const target=visible[visible.indexOf(id)+(event.key==='ArrowLeft'?-1:1)];if(target){move(order.indexOf(id),order.indexOf(target));$('preview-'+id)?.focus()}};
    panel.append(button);
  }
  if(!visible.length)panel.textContent=t('emptyPreview');
  panel.scrollLeft=scroll;
}
function change(){dirty=true;state.footerOrder=[...order];preview();renderNotice();status(t('unsaved'));clearTimeout(timer);timer=setTimeout(save,250)}
async function save(){
  if(saving)return;saving=true;$('retry').hidden=true;
  try{while(dirty){dirty=false;const body=structuredClone(state);status(t('saving'));await request('PUT',body)}status(t('saved'))}
  catch(error){dirty=true;status(t('saveFailed')+'：'+error.message,true);$('retry').hidden=false}
  finally{saving=false}
}
function box(settingId,onToggle){
  const input=document.createElement('input');
  input.type='checkbox';input.checked=!!state[settingId];input.id=settingId;
  input.onchange=()=>{state[settingId]=input.checked;onToggle?.(input.checked)};
  return input;
}
function feature(item){
  const card=document.createElement('article');card.className='feature';
  const head=document.createElement('div');head.className='feature-head';
  const title=document.createElement('h3');title.textContent=item.title;head.append(title);
  if(item.setting){
    const label=document.createElement('label');label.className='switch';label.htmlFor=item.setting;
    const text=document.createElement('span');text.textContent=state[item.setting]?t('on'):t('off');
    label.append(box(item.setting,checked=>{text.textContent=checked?t('on'):t('off');change()}),text);
    head.append(label);
  }
  const body=document.createElement('p');body.className='feature-body';body.textContent=item.body;
  const points=document.createElement('ul');points.className='feature-points';
  points.append(...item.points.map(point=>{const li=document.createElement('li');li.textContent=point;return li}));
  const hint=document.createElement('p');hint.className='feature-hint';hint.textContent=item.hint;
  card.append(head,body,points,hint);
  return card;
}
function checkbox(id,settingId){
  const label=document.createElement('label'),input=box(settingId,()=>{
    if(state[settingId]&&(id==='project-branch'||id==='branch')){const other=key(id==='branch'?'project-branch':'branch');state[other]=false;const peer=$(other);if(peer)peer.checked=false}
    change();
  });
  label.append(input,document.createTextNode(fieldLabel(id)));
  return label;
}
function move(from,to){if(from===to||from<0||to<0||to>=order.length)return;const [id]=order.splice(from,1);order.splice(to,0,id);preview();change()}
function render(){
  applyLang();
  renderNotice();
  $('fields').replaceChildren(...order.map(id=>checkbox(id,key(id))));
  $('features').replaceChildren(...t('featureList').map(feature));
  $('options').replaceChildren(...['context-dots','speed-unit'].map(id=>checkbox(id,FIELD_KEY[id])));
  preview();
}
function renderNotice(){
  // Minimal output needs the fullscreen renderer; only a known regular mode warrants the prompt.
  const show=!!data&&data.tuiMode==='regular'&&!!state['pi-mini-mode-minimal-show'];
  $('notice').hidden=!show;
  if(!show)return;
  $('noticeTitle').textContent=t('noticeTitle');
  $('noticeBody').textContent=t('noticeBody');
  $('noticePrompt').textContent=t('noticePrompt');
  $('copyPrompt').textContent=t('copyPrompt');
}
$('copyPrompt').onclick=async()=>{
  const button=$('copyPrompt');
  try{await navigator.clipboard.writeText(t('noticePrompt'));button.textContent=t('copied')}
  catch{
    const range=document.createRange();range.selectNodeContents($('noticePrompt'));
    const selection=getSelection();selection?.removeAllRanges();selection?.addRange(range);
    button.textContent=t('copyFailed');
  }
  clearTimeout(copyTimer);
  copyTimer=setTimeout(()=>button.textContent=t('copyPrompt'),1600);
};
function setLang(next){lang=next;localStorage.piMiniModeLang=lang;render()}
$('lang-zh').onclick=()=>setLang('zh');
$('lang-en').onclick=()=>setLang('en');
$('retry').onclick=save;
$('reset').onclick=()=>{if(!confirm(t('confirmReset')))return;state={...data.defaults};order=[...data.order];render();change()};
window.addEventListener('beforeunload',event=>{if(dirty||saving){event.preventDefault();event.returnValue=''}});
applyLang();status(t('connecting'));
request('GET').then(value=>{data=value;state={...data.settings};order=[...(state.footerOrder||data.order)];render();$('reset').disabled=false;status(t('connected'))}).catch(()=>status(t('reconnect'),true));
</script>
</html>
