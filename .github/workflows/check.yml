name: Check

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'themes/**'
      - '!themes/README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'themes/**'
      - '!themes/README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache Node 24
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/node/24.*
          key: node-24-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - run: npm run check
