name: Check

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'themes/**'
      - '!themes/README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'themes/**'
      - '!themes/README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use preinstalled Node 24
        id: node
        run: |
          if node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 24 ? 0 : 1)' 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            node_bin="$(ls -d "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"/node/24.*/*/bin 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$node_bin" ]; then
              echo "$node_bin" >> "$GITHUB_PATH"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.node.outputs.found != 'true'
        with:
          node-version: '24'
      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
