# AI 审核使用 Codex CLI 与 CODEX_AUTH_JSON（ChatGPT 登录），参考鹅笔记。
# 审核只读默认分支脚本和 PR diff，不执行 PR 代码，也不 checkout fork。
# CODEX_AUTH_JSON 只注入同仓库 review / validate，不暴露给 fork PR。
# 审核 JSON 用 artifact 交给闸门，不用 job output（Actions 会把疑似 secret 的 output 丢掉）。
# workflow_dispatch 仅验收审核结果，不触发合并、评论或标签。
# Secret 缺失、审核异常或输出不合法时失败，自动合并仍按原规则拦截。
# 例外：仓库主人的同仓库 PR 在 safe_to_merge 时，非密钥受保护路径也可 squash 合并，且不要求 bot-automerge。

name: AI review & auto-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '同仓库 PR 编号（只读验收，可选已关闭 PR）'
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number || format('validation-{0}', inputs.pr_number) }}
  cancel-in-progress: true

env:
  AUTOMERGE_LABEL: bot-automerge          # Bot 开 PR 时加这个标签才会自动合并
  BLOCK_LABEL: needs-human                # 不合并时打的标签
  ALLOWED_AUTHORS: eachann1024            # 逗号分隔；只合并这些作者的 PR
  ALLOW_CAUTION: "true"                   # merge_with_caution 不是致命问题，默认放行（用户口径：没有致命问题就合并）
  CHECKS_TIMEOUT_MIN: "20"                # 等其他 CI 的上限，超时不合并
  OWNER_LOGIN: eachann1024                # 同仓库且结论为 safe_to_merge 时，非密钥受保护路径也自动合并，不要求 bot-automerge
  # 动到这些路径默认转人工（审核/CI 配置、密钥、部署配置）。规则：以 / 结尾=任意层级目录；以 * 开头=后缀；其他=文件名前缀
  # 仓库主人（OWNER_LOGIN）的同仓库 PR，若审核结论是 safe_to_merge，即使改到下列非密钥路径也自动 squash 合并，且不要求 bot-automerge。
  # 密钥材料没有豁免，仍转人工并打 needs-human。当前路径、previous_filename、删除路径都按 / 拆开，检查每一段：
  # 任一段等于 secrets 或 credentials（大小写不敏感，如 .github/secrets/production.json）；任一段以 .env 开头。
  # 只有最后一段（文件名）匹配 *.pem、*.key、*.p12、id_rsa*。
  # 其他作者或 fork 没有豁免；受保护路径仍转人工。fork 不进入本工作流。
  # 仓库有其他部署配置（如自定义 deploy 脚本目录）就追加到这里
  PROTECTED_PATHS: ".github/,.pr_agent.toml,.gemini/,.coderabbit.yaml,.greptile/,.env,secrets,credentials,*.pem,*.key,*.p12,id_rsa,deploy/,vercel.json,netlify.toml,fly.toml,wrangler.toml,render.yaml,Dockerfile,docker-compose,compose.yaml,compose.yml,Procfile,publish.mjs,release.sh"
  SECRET_PATHS: ".env,secrets,credentials,*.pem,*.key,*.p12,id_rsa"

jobs:
  review:
    name: ai-review
    # 只审同仓库分支、作者是仓库主人的非草稿 PR（作者名与 env.ALLOWED_AUTHORS 保持一致）；labeled 事件只在加的是自动合并标签时才触发
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'bot-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write       # 上传审核 artifact；受限 token 没有这项会在首次运行失败
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout review script from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Codex review (ChatGPT login)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! bash .github/codex-review/run.sh > "$RUNNER_TEMP/review.json"; then
            echo "Codex 审核脚本失败，未上传审核结果" >&2
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/review.json" ]; then
            echo "Codex 审核脚本没有写出审核结果" >&2
            exit 1
          fi
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-result
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 7


  validate:
    name: ai-review-validation
    # 手动验收仅生成审核结果；不调用合并闸门、不写评论或标签。
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write       # 上传验收 artifact
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve owned same-repository PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pr, repo = os.environ['PR'], os.environ['REPO']
          if not re.fullmatch(r'[1-9][0-9]*', pr):
              raise SystemExit('PR 编号不合法')
          info = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{pr}'], text=True))
          if info['user']['login'] != 'eachann1024' or (info['head'].get('repo') or {}).get('full_name') != repo:
              raise SystemExit('只允许仓库主人的同仓库 PR')
          sha = info['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('PR 提交不合法')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={sha}\n')
          PY
      - name: Validate Codex review (read-only)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/validated-review.json"
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "validated-review.json")
          data = json.load(open(path, encoding="utf-8"))
          issues = data.get("key_issues_to_review")
          count = len(issues) if isinstance(issues, list) else 0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(
                  "## Codex 审核验收\n\n"
                  f"- merge_recommendation={data.get('merge_recommendation', '')}\n"
                  f"- risk_level={data.get('risk_level', '')}\n"
                  f"- key_issues={count}\n"
                  "- 正文未写入日志或摘要，完整结果在 artifact。\n"
              )
          PY
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-validation
          path: ${{ runner.temp }}/validated-review.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: ai-merge-gate
    needs: review
    # review 失败/超时也要进来打标签（被新提交取消的旧运行不进来），只处理同仓库 PR
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'bot-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read         # 下载同一运行里的审核 artifact
      contents: write        # 合并 + 删除分支
      pull-requests: write   # 打标签、评论
      issues: write
      checks: read
      statuses: read
    steps:
      - name: Checkout gate script from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download AI review result
        id: review-file
        if: needs.review.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: codex-review-result
          path: ${{ runner.temp }}/codex-review-result
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_DOWNLOAD: ${{ steps.review-file.outcome }}
          REVIEW_ARTIFACT: ${{ runner.temp }}/codex-review-result/review.json
        run: |
          cd "$GITHUB_WORKSPACE"
          script=".github/codex-review/merge.py"
          helper=".github/codex-review/review_json.py"
          if [ ! -f "$script" ] || [ ! -f "$helper" ]; then
            echo "默认分支缺少闸门脚本（$script 或 $helper）。拒绝静默跳过。" >&2
            exit 1
          fi
          if [ "$REVIEW_RESULT" = "success" ] && [ "$REVIEW_DOWNLOAD" != "success" ]; then
            echo "审核任务已成功，但下载审核 artifact 失败（outcome=${REVIEW_DOWNLOAD}）。检查 actions: read 权限和 artifact 名称 codex-review-result。" >&2
            exit 1
          fi
          python3 "$script"
